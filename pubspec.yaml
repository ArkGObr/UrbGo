name: urbgo
description: "UrbGo — App de intermediação logística urbana"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_local_notifications: ^17.2.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  dio: ^5.4.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
